name: fuvekonmobile
description: Fuvekon mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.0.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  json_annotation: ^4.9.0
  logger: ^2.5.0
  intl: ^0.20.2
  flutter_dotenv: ^6.0.1
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.3
  package_info_plus: ^10.1.0
  flutter_localizations:
    sdk: flutter
  mobile_scanner: ^7.2.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.9.5

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/images/ticket/
    - assets/images/logo/
    - assets/images/Section - Hero Banner.png
    - assets/images/un-auth-user-landing-section.png
    - assets/images/background-trang-chu.png
    - assets/images/event.png
    - assets/images/cover-artbook.png
    - assets/images/artbook-background.png
