version: "3"

# FuveKonMobile - Root Taskfile
#
# Include Fuvekonse backend tasks voi namespace 'backend'.
# Cai dat Task runner neu chua co:
#   go install github.com/go-task/task/v3/cmd/task@latest
#
# Chay 'task --list' de xem tat ca task.

includes:
  backend:
    taskfile: ./Fuvekonse/Taskfile.yml
    dir: ./Fuvekonse

tasks:
  subtree-pull:
    desc: "Pull latest Fuvekonse vao subfolder Fuvekonse/ (upstream wins on conflict)"
    vars:
      REMOTE: "https://github.com/SoltuneMontepre/Fuvekonse.git"
      BRANCH: "main"
    cmds:
      - echo ">>> Stashing local changes (if any)..."
      - git stash push -m subtree-pull-stash
      - echo ">>> Fetching Fuvekonse from GitHub..."
      - git fetch {{.REMOTE}} {{.BRANCH}}
      - echo ">>> Merging into ./Fuvekonse/ (upstream wins on conflict)..."
      - git merge -X subtree=Fuvekonse -X theirs --squash --no-edit --allow-unrelated-histories FETCH_HEAD
      - git commit --allow-empty -m "sync Fuvekonse subtree to upstream main"
      - echo ">>> Restoring local changes..."
      - git stash pop
      - echo ">>> Done! Fuvekonse/ is up to date."
