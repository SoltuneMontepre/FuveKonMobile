<html>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #ebe3d1;
      -webkit-text-size-adjust: 100%;
    "
  >
    <div
      style="
        padding: 32px 16px 40px 16px;
        font-family: Arial, Helvetica, sans-serif;
      "
    >
      <div style="max-width: 560px; margin: 0 auto">
        <p
          style="
            margin: 0 0 20px 0;
            text-align: center;
            font-size: 11px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: #7a7166;
          "
        >
          Furry Vietnam Eternity
        </p>
        <div
          style="
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(31, 24, 18, 0.14);
            border: 1px solid #e2d8c4;
          "
        >
          <div
            style="
              background: #1a1410;
              padding: 24px 24px 20px 24px;
              text-align: center;
            "
          >
            <span
              style="
                display: inline-block;
                color: #e8c547;
                font-size: 24px;
                font-weight: 700;
                letter-spacing: 0.14em;
                line-height: 1;
              "
              >FUVE</span
            >
          </div>
          <div style="padding: 28px 24px 32px 24px">
            <p
              style="
                margin: 0 0 8px 0;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.12em;
                color: #7a7166;
              "
            >
              Message from FUVE
            </p>
            <h1
              style="
                margin: 0 0 20px 0;
                font-size: 22px;
                font-weight: 700;
                color: #1a1410;
                line-height: 1.35;
              "
            >
              {{.Title}}
            </h1>
            <div
              style="
                margin: 0;
                padding: 16px 18px;
                background: #faf7f0;
                border-radius: 12px;
                border: 1px solid #e2d8c4;
                font-size: 15px;
                line-height: 1.55;
                color: #2d2820;
                white-space: pre-wrap;
                word-break: break-word;
              "
            >
              {{.Body}}
            </div>
          </div>
        </div>
        <p
          style="
            margin: 24px 0 0 0;
            text-align: center;
            font-size: 12px;
            color: #7a7166;
            line-height: 1.5;
          "
        >
          You can also read this in your account notifications on the FUVE website or app.
        </p>
      </div>
    </div>
  </body>
</html>
